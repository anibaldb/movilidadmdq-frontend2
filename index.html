<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movilidad MDQ — Frontend 2</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0ea5e9 0%, #1e3a8a 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { opacity: 0.9; line-height: 1.6; }
    .tag {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚌 Movilidad MDQ</h1>
    <p>Frontend 2 en construcción. Este año lo armamos con HTML, CSS, JS y después Angular.</p>
    <span class="tag">En construcción</span>
  </div>
</body>
</html>
