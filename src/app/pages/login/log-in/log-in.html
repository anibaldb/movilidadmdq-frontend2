<main class="login-page">
  <form class="login-card" (submit)="enviar($event)">
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Ingresá con tu cuenta para continuar</p>

    <div class="campo">
      <label for="username">Usuario</label>
      <input id="username" type="text" [formField]="loginForm.username"/>
      <app-mensaje-error class="error" [campo]="loginForm.username()"></app-mensaje-error>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="password-wrap">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          [formField]="loginForm.password"
        />
        <app-mensaje-error class="error" [campo]="loginForm.password()"></app-mensaje-error>
        <button
          type="button"
          class="toggle"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          {{ showPassword() ? 'Ocultar' : 'Ver' }}
        </button>
      </div>
    </div>

    <button class="submit" type="submit" [disabled]="loginForm().touched() && loginForm().invalid()">
      Ingresar
    </button>

    @if (error() != '') {
        <p  class="error">{{error()}}</p>
    }

    <p class="registro">¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
  </form>
</main>
