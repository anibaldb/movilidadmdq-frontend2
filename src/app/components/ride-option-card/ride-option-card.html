<div class="ride-card">
  <div class="ride-info">
    <span class="ride-tipo">{{ option().tipo }}</span>
    <span class="ride-tiempo">{{ option().tiempoEstimado }}</span>
  </div>

  <div class="ride-accion">
    <span class="ride-precio">${{ option().precio | number: '1.0-0' }}</span>
    <a class="btn-elegir"
       [href]="option().url"
       [attr.target]="esLlamada() ? null : '_blank'"
       rel="noopener">
      {{ esLlamada() ? 'Llamar' : 'Elegir' }}
    </a>
  </div>
</div>
