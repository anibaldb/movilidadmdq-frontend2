<header class="header">
  <div>
    <a class="marca" routerLink="/calcular">Movilidad<strong>MDQ</strong></a>
    <p class="saludo">Hola, {{ nombreUsuario() }}</p>
  </div>

  <!-- PC: solo el botón de salir; la navegación va en las pestañas -->
  <app-icon-button class="solo-pc" title="Cerrar sesión" (click)="cerrarSesion()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <path d="M16 17l5-5-5-5" />
      <path d="M21 12H9" />
    </svg>
  </app-icon-button>

  <!-- Celular: menú hamburguesa -->
  <div class="menu solo-celular">
    <button type="button" class="btn-menu" (click)="alternarMenu()"
            [attr.aria-expanded]="menuAbierto()" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    @if (menuAbierto()) {
      <nav class="menu-lista">
        @if (esAdmin()) {
          <a class="menu-item" routerLink="/admin/tarifa" (click)="cerrarMenu()">Configuración de tarifa</a>
          <a class="menu-item" routerLink="/admin/usuarios" (click)="cerrarMenu()">Gestión de usuarios</a>
        } @else {
          <a class="menu-item" routerLink="/perfil" (click)="cerrarMenu()">Mi perfil</a>
          <a class="menu-item" routerLink="/historial" (click)="cerrarMenu()">Mi historial</a>
          <a class="menu-item" routerLink="/favoritos" (click)="cerrarMenu()">Mis direcciones favoritas</a>
        }
        <button type="button" class="menu-item menu-salir" (click)="cerrarSesion()">Cerrar sesión</button>
      </nav>
    }
  </div>
</header>
