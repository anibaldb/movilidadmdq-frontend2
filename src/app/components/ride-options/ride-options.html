@if (hasRoute()) {
  <div class="ride-options">
    @for (option of options; track option.id) {
      <app-ride-option-card [option]="option" />
    }
  </div>
} @else {
  <div class="empty-state">Ingresa tu ruta para ver opciones</div>
}

<p class="disclaimer">Precios estimados basados en la tarifa actual.</p>
