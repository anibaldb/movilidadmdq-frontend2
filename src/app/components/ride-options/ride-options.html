@if(cargando()){
  <div class="empty-state">Calculando opciones...</div>
}@else if (opciones().length > 0) {
  <div class="ride-options">
    @for (option of opciones(); track option.id) {
      <app-ride-option-card [option]="option" />
    }
  </div>
}@else {
  <div class="empty-state">
    {{hasRoute() ? 'No hay opciones disponibles para esta ruta' : 'Ingresa tu ruta para ver opciones'}}
  </div>
}

<p class="disclaimer">Precios estimados basados en la tarifa actual.</p>
